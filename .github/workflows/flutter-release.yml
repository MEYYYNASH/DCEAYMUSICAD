name: Build & Release DCEAY Flutter APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK & SHA-256
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Artifacts & Calculate SHA-256 Digest
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/DCEAY-release.apk
          cd release-artifacts
          sha256sum DCEAY-release.apk > DCEAY-release.apk.sha256
          echo "Computed SHA-256 Digest:"
          cat DCEAY-release.apk.sha256

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCEAY-Flutter-Release-APK
          path: release-artifacts/DCEAY-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: DCEAY Release v2.1.0 (Dotify Concept Architecture)
          files: |
            release-artifacts/DCEAY-release.apk
            release-artifacts/DCEAY-release.apk.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
