name: Build & Publish DCEAY Android APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Version Tag (e.g. v1.2.1)"
        required: false
        default: "v1.2.1"

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build DCEAY Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Named APK Artifact and Generate SHA-256 Checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk DCEAY-release.apk
          sha256sum DCEAY-release.apk > DCEAY-release.apk.sha256
          SHA256_HASH=$(cat DCEAY-release.apk.sha256 | awk '{print $1}')
          echo "SHA256_VAL=$SHA256_HASH" >> $GITHUB_ENV
          echo "DCEAY-release.apk SHA-256: $SHA256_HASH"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DCEAY-Android-APK
          path: |
            DCEAY-release.apk
            DCEAY-release.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk

      - name: Determine Release Tag
        id: tag_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.2.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release for DCEAY In-App Auto-Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag_name }}
          name: "DCEAY ${{ steps.tag_step.outputs.tag_name }}"
          body: |
            ### DCEAY — One App, All Your Music (${{ steps.tag_step.outputs.tag_name }})
            *Tagline: One App, All Your Music.*

            #### Release Highlights
            - **Cover-to-Background Engine**: Live artwork-driven ambient background with dynamic blur and animated gradient mesh.
            - **Syllable-Synced Lyrics Studio**: Word-by-word karaoke synchronization, translation toggle, and manual timestamp calibration.
            - **Universal Link Import**: YouTube video/playlist, Spotify track/playlist metadata, direct audio stream vault.
            - **Personalization Studio**: Cyberpunk Neon, Glassmorphism, and Midnight Slate themes.
            - **In-App Auto-Update Ready**: Verified through the official GitHub Releases API.

            #### Security & Integrity Verification
            - **File**: `DCEAY-release.apk`
            - **SHA-256 Checksum**: `${{ env.SHA256_VAL }}`
            - In-app updater automatically computes and verifies this hash before requesting Android package installation.
          draft: false
          prerelease: false
          files: |
            DCEAY-release.apk
            DCEAY-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
