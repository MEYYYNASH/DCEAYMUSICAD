name: Build & Publish XECEAY Android APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Version Tag (e.g. v1.0.1)"
        required: false
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build XECEAY Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Named APK Artifact for In-App Auto-Updater
        run: |
          cp app/build/outputs/apk/release/app-release.apk XECEAY-release.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XECEAY-Android-APK
          path: |
            XECEAY-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Determine Release Tag
        id: tag_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release for XECEAY In-App Auto-Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag_name }}
          name: "XECEAY ${{ steps.tag_step.outputs.tag_name }}"
          body: |
            ### XECEAY — Music Downloader & Offline Player (${{ steps.tag_step.outputs.tag_name }})
            *Tagline: Your Music. Your Quality. Your World.*

            - **In-App Auto-Update Ready**: Open **XECEAY → Settings → Check GitHub Release** to download and install this APK directly inside the app.
            - **Direct APK Download**: Download `XECEAY-release.apk` below.
          draft: false
          prerelease: false
          files: |
            XECEAY-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
